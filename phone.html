<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📻 Переговорное устройство</title>
    <!-- Firebase compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b0e14;
            --panel: #161b24;
            --panel-hover: #1e2633;
            --text: #e8edf5;
            --text-dim: #8892a3;
            --accent: #5b7cfa;
            --accent-hover: #4a6ae0;
            --danger: #f87171;
            --success: #4ade80;
            --border: #2a3342;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 14px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            max-width: 1100px;
            width: 100%;
            background: var(--panel);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ---------- HEADER (внутри раскрывающегося сегмента) ---------- */
        .header {
            padding: 18px 28px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 span {
            background: var(--accent);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 20px;
            color: #fff;
            letter-spacing: 0.3px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        .status-badge .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .status-badge .dot.online {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }
        .status-badge .dot.offline {
            background: #555;
        }
        .status-badge .dot.recording {
            background: var(--danger);
            box-shadow: 0 0 12px var(--danger);
            animation: pulse-dot 0.8s infinite alternate;
        }

        @keyframes pulse-dot {
            0% {
                opacity: 0.5;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ---------- BODY LAYOUT (внутри раскрывающегося сегмента) ---------- */
        .body {
            display: grid;
            grid-template-columns: 240px 1fr 200px;
            gap: 0;
            min-height: 460px;
        }

        @media (max-width: 820px) {
            .body {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .sidebar-left,
            .sidebar-right {
                border-right: none !important;
                border-bottom: 1px solid var(--border);
            }
            .sidebar-right {
                border-left: none !important;
            }
        }

        /* ---------- SIDEBARS ---------- */
        .sidebar-left {
            padding: 20px 18px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-right {
            padding: 20px 18px;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-dim);
            font-weight: 600;
        }

        .sidebar-left input,
        .sidebar-left select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: border 0.2s;
        }
        .sidebar-left input:focus,
        .sidebar-left select:focus {
            border-color: var(--accent);
        }

        .sidebar-left .join-btn {
            padding: 8px 0;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .sidebar-left .join-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }
        .sidebar-left .join-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* online users */
        .users-list {
            list-style: none;
            margin-top: 4px;
            max-height: 180px;
            overflow-y: auto;
        }
        .users-list li {
            padding: 5px 0;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .users-list .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            flex-shrink: 0;
        }
        .users-list .self {
            color: var(--accent);
            font-weight: 500;
        }
        .users-list .offline-user {
            opacity: 0.4;
        }
        .users-list .offline-user .online-dot {
            background: #555;
        }

        .user-count {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 2px;
        }

        /* ---------- MAIN AREA (видимая часть) ---------- */
        .main {
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            min-height: 360px;
        }

        .ptt-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(145deg, #1e2a3a, #141c28);
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 -4px 0 rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            user-select: none;
            position: relative;
        }
        .ptt-btn .icon {
            font-size: 2.4rem;
            line-height: 1;
        }
        .ptt-btn .label {
            font-size: 1rem;
            letter-spacing: 0.3px;
        }
        .ptt-btn .sub {
            font-size: 0.6rem;
            font-weight: 400;
            color: var(--text-dim);
            letter-spacing: 0.2px;
        }

        .ptt-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), inset 0 -4px 0 rgba(0, 0, 0, 0.3);
        }
        .ptt-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .ptt-btn.recording {
            background: linear-gradient(145deg, #4a1a2a, #2a0e1a);
            box-shadow: 0 0 40px rgba(248, 113, 113, 0.25), inset 0 -4px 0 rgba(0, 0, 0, 0.3);
            animation: pulse-ring 1.2s infinite alternate;
        }
        .ptt-btn.recording .label {
            color: var(--danger);
        }

        @keyframes pulse-ring {
            0% {
                box-shadow: 0 0 20px rgba(248, 113, 113, 0.15), inset 0 -4px 0 rgba(0, 0, 0, 0.3);
            }
            100% {
                box-shadow: 0 0 60px rgba(248, 113, 113, 0.35), inset 0 -4px 0 rgba(0, 0, 0, 0.3);
            }
        }

        .ptt-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .ptt-btn .timer {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 400;
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }

        .action-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .repeat-btn {
            padding: 10px 28px;
            border: 1px solid var(--border);
            border-radius: 40px;
            background: transparent;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .repeat-btn:hover:not(:disabled) {
            background: var(--panel-hover);
            border-color: var(--accent);
        }
        .repeat-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .repeat-btn .badge {
            background: var(--accent);
            color: #fff;
            font-size: 0.6rem;
            padding: 1px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* volume slider */
        .vol-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
            width: 100%;
            max-width: 240px;
        }
        .vol-row label {
            font-size: 0.75rem;
            color: var(--text-dim);
            white-space: nowrap;
        }
        .vol-row input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--border);
            border-radius: 2px;
            outline: none;
        }
        .vol-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }
        .vol-row .vol-val {
            font-size: 0.75rem;
            color: var(--text-dim);
            min-width: 36px;
            text-align: right;
        }

        /* ---------- Раскрывающийся сегмент (details) ---------- */
        .extra-panel {
            border-top: 1px solid var(--border);
        }
        .extra-panel summary {
            list-style: none;
            cursor: pointer;
            padding: 8px 16px;
            font-size: 0.85rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            transition: color 0.2s;
            background: rgba(255, 255, 255, 0.02);
        }
        .extra-panel summary:hover {
            color: var(--text);
        }
        .extra-panel summary::-webkit-details-marker {
            display: none;
        }
        .extra-panel[open] summary {
            border-bottom: 1px solid var(--border);
        }

        /* Центральная панель внутри details (greeting и status-text) */
        .center-panel {
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .greeting {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-dim);
            text-align: center;
        }
        .greeting strong {
            color: var(--text);
        }

        .status-text {
            font-size: 0.9rem;
            color: var(--text-dim);
            text-align: center;
            min-height: 1.6em;
        }
        .status-text strong {
            color: var(--text);
        }

        /* notification toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            color: var(--text);
            box-shadow: var(--shadow);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 999;
            backdrop-filter: blur(8px);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast .highlight {
            color: var(--accent);
            font-weight: 600;
        }

        /* scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* mic level indicator */
        .mic-level {
            margin-top: 6px;
            height: 3px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            width: 100%;
        }
        .mic-level .fill {
            height: 100%;
            width: 0%;
            background: var(--success);
            border-radius: 2px;
            transition: width 0.05s linear;
        }

        .sidebar-left .mic-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .sidebar-left .mic-row .mic-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- ГЛАВНАЯ ВИДИМАЯ ОБЛАСТЬ -->
        <main class="main" id="main-area">
            <button class="ptt-btn" id="ptt-btn" disabled>
                <span class="icon">🎤</span>
                <span class="label">Записать</span>
                <span class="sub">нажмите для записи</span>
                <span class="timer" id="record-timer"></span>
            </button>

            <div class="action-row">
                <button class="repeat-btn" id="repeat-btn" disabled>
                    🔁 Повторить
                    <span class="badge" id="repeat-badge">0</span>
                </button>
                <!-- Новая кнопка мини-плеера -->
                <button class="repeat-btn" id="pip-btn">
                    📺 Мини-плеер
                </button>
            </div>

            <div class="vol-row">
                <label>🔊</label>
                <input type="range" id="volume-slider" min="0" max="100" value="80" />
                <span class="vol-val" id="vol-label">80%</span>
            </div>
        </main>

        <!-- РАСКРЫВАЮЩИЙСЯ СЕГМЕНТ (ВСЁ ОСТАЛЬНОЕ) -->
        <details class="extra-panel">
            <summary>⚙️ Настройки</summary>
            <div class="extra-content">
                <!-- HEADER -->
                <header class="header">
                    <h1>📻 Переговорное <span>на одно сообщение</span></h1>
                    <div class="status-badge">
                        <span class="dot offline" id="connection-dot"></span>
                        <span id="connection-label">Ожидание...</span>
                    </div>
                </header>

                <!-- BODY -->
                <div class="body">
                    <!-- LEFT SIDEBAR -->
                    <aside class="sidebar-left">
                        <div>
                            <div class="sidebar-label">👤 Ваше имя</div>
                            <input type="text" id="display-name" placeholder="Введите имя" />
                        </div>

                        <div>
                            <div class="sidebar-label">🎙️ Микрофон</div>
                            <select id="mic-select"></select>
                            <div class="mic-level">
                                <div class="fill" id="mic-level-fill"></div>
                            </div>
                            <div class="mic-row">
                                <div class="mic-label">
                                    <span>Уровень</span>
                                    <span id="mic-level-text">0%</span>
                                </div>
                            </div>
                        </div>

                        <button class="join-btn" id="join-btn" disabled>🔗 Присоединиться</button>

                        <div>
                            <div class="sidebar-label">👥 Онлайн</div>
                            <ul class="users-list" id="users-list">
                                <li style="color:var(--text-dim); font-size:0.8rem;">Нет подключённых</li>
                            </ul>
                            <div class="user-count" id="user-count">—</div>
                        </div>
                    </aside>

                    <!-- CENTER PANEL (greeting и status-text) -->
                    <div class="center-panel">
                        <div class="greeting" id="greeting">
                            👋 Введите имя и нажмите <strong>«Присоединиться»</strong>
                        </div>
                        <div class="status-text" id="status-text">📡 Готов к работе</div>
                    </div>

                    <!-- RIGHT SIDEBAR -->
                    <aside class="sidebar-right">
                        <div>
                            <div class="sidebar-label">📋 Последнее сообщение</div>
                            <div id="last-msg-info" style="font-size:0.85rem; color:var(--text-dim); margin-top:4px;">
                                Нет сообщений
                            </div>
                        </div>

                        <div>
                            <div class="sidebar-label">📊 Статистика</div>
                            <div style="font-size:0.8rem; color:var(--text-dim); line-height:1.6;">
                                <div id="stat-sent">Отправлено: <strong>0</strong></div>
                                <div id="stat-received">Получено: <strong>0</strong></div>
                            </div>
                        </div>

                        <div style="margin-top:auto; padding-top:12px; border-top:1px solid var(--border);">
                            <button id="clear-all-btn" style="
                            width:100%;
                            padding:6px 0;
                            border:none;
                            border-radius:6px;
                            background:transparent;
                            color:var(--danger);
                            font-size:0.75rem;
                            cursor:pointer;
                            opacity:0.6;
                            transition:opacity 0.2s;
                            ">🗑️ Очистить все</button>
                        </div>
                    </aside>
                </div>
            </div>
        </details>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  FIREBASE CONFIG
        // ============================================================
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyB9Kn7XlW7Gofyz-5JfKo8V2n53DpKdMnM",
            authDomain: "hectortw-apoj.firebaseapp.com",
            databaseURL: "https://hectortw-apoj-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "hectortw-apoj",
            storageBucket: "hectortw-apoj.firebasestorage.app",
            messagingSenderId: "167890858554",
            appId: "1:167890858554:web:abdbad2243e223f5457b03"
        };

        // ============================================================
        //  STATE
        // ============================================================
        let db = null;
        let userId = null;
        let displayName = '';
        let isJoined = false;

        let localStream = null;
        let audioContext = null;
        let analyserNode = null;
        let micSource = null;
        let dataArray = null;
        let volAnimId = null;

        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordStartTime = 0;
        let recordTimerId = null;

        let currentAudio = null; // HTMLAudioElement currently playing
        let lastMessageData = null; // { id, author, base64, mimeType }
        let sentCount = 0;
        let receivedCount = 0;
        let isPlaying = false;
        let playbackVolume = 0.8;
        let isMuted = false;

        const DB_ROOT = 'walkieTalkie'; // отдельная директория

        // ============================================================
        //  DOM REFS
        // ============================================================
        const $ = id => document.getElementById(id);
        const displayNameInput = $('display-name');
        const micSelect = $('mic-select');
        const joinBtn = $('join-btn');
        const usersList = $('users-list');
        const userCount = $('user-count');
        const pttBtn = $('ptt-btn');
        const repeatBtn = $('repeat-btn');
        const repeatBadge = $('repeat-badge');
        const statusText = $('status-text');
        const greeting = $('greeting');
        const recordTimer = $('record-timer');
        const volSlider = $('volume-slider');
        const volLabel = $('vol-label');
        const micLevelFill = $('mic-level-fill');
        const micLevelText = $('mic-level-text');
        const connectionDot = $('connection-dot');
        const connectionLabel = $('connection-label');
        const lastMsgInfo = $('last-msg-info');
        const statSent = $('stat-sent');
        const statReceived = $('stat-received');
        const toast = $('toast');
        const clearAllBtn = $('clear-all-btn');
        const pipBtn = $('pip-btn');

        // ============================================================
        //  TOAST
        // ============================================================
        let toastTimer = null;

        function showToast(msg, duration = 2500) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        // ============================================================
        //  FIREBASE INIT
        // ============================================================
        function initFirebase() {
            try {
                firebase.initializeApp(FIREBASE_CONFIG);
                db = firebase.database();
                connectionDot.className = 'dot online';
                connectionLabel.textContent = 'Firebase OK';
                joinBtn.disabled = false;
                statusText.textContent = '📡 Введите имя и присоединяйтесь';
                initApp();
            } catch (e) {
                console.error('Firebase init error:', e);
                connectionDot.className = 'dot offline';
                connectionLabel.textContent = 'Ошибка подключения';
                statusText.textContent = '❌ Ошибка загрузки Firebase';
            }
        }

        // ============================================================
        //  APP INIT
        // ============================================================
        function initApp() {
            userId = localStorage.getItem('wtUserId');
            if (!userId) {
                userId = 'user_' + Math.random().toString(36).substr(2, 8);
                localStorage.setItem('wtUserId', userId);
            }
            const savedName = localStorage.getItem('wtDisplayName') || '';
            displayNameInput.value = savedName;
            if (savedName) {
                displayName = savedName;
                greeting.textContent = `👋 Добро пожаловать, ${displayName}`;
            }

            setupDevices();

            joinBtn.addEventListener('click', joinChat);
            displayNameInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinChat(); });

            pttBtn.addEventListener('click', handlePttClick);
            repeatBtn.addEventListener('click', handleRepeat);

            volSlider.addEventListener('input', e => {
                playbackVolume = e.target.value / 100;
                volLabel.textContent = Math.round(playbackVolume * 100) + '%';
                if (currentAudio) currentAudio.volume = playbackVolume;
            });

            clearAllBtn.addEventListener('click', clearAllMessages);

            // Кнопка мини-плеера
            pipBtn.addEventListener('click', openPip);

            // Auto-join if name is saved
            if (savedName) {
                setTimeout(joinChat, 400);
            }
        }

        // ============================================================
        //  DEVICES
        // ============================================================
        async function setupDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                micSelect.innerHTML = '';
                const audioInputs = devices.filter(d => d.kind === 'audioinput');
                if (audioInputs.length === 0) {
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = '❌ Нет микрофонов';
                    micSelect.appendChild(opt);
                } else {
                    audioInputs.forEach((d, i) => {
                        const opt = document.createElement('option');
                        opt.value = d.deviceId;
                        opt.textContent = d.label || `Микрофон ${i + 1}`;
                        micSelect.appendChild(opt);
                    });
                }
                micSelect.addEventListener('change', () => {
                    if (localStream) {
                        localStream.getTracks().forEach(t => t.stop());
                        localStream = null;
                    }
                    if (isJoined) setupMicrophone();
                });
            } catch (e) {
                console.warn('Enum devices error:', e);
            }
        }

        // ============================================================
        //  MICROPHONE
        // ============================================================
        async function setupMicrophone() {
            try {
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                if (micSource) {
                    micSource.disconnect();
                    micSource = null;
                }
                if (analyserNode) {
                    analyserNode.disconnect();
                    analyserNode = null;
                }

                const deviceId = micSelect.value;
                const constraints = {
                    audio: deviceId ? { deviceId: { exact: deviceId } } : true,
                    video: false
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);

                if (!audioContext) {
                    audioContext = new(window.AudioContext || window.webkitAudioContext)();
                }
                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = 256;
                micSource = audioContext.createMediaStreamSource(localStream);
                micSource.connect(analyserNode);
                dataArray = new Uint8Array(analyserNode.frequencyBinCount);

                startVolumeMeter();
                pttBtn.disabled = false;
                statusText.textContent = '🎙️ Микрофон готов';
                return true;
            } catch (e) {
                console.error('Microphone error:', e);
                statusText.textContent = '❌ Ошибка микрофона: ' + e.message;
                pttBtn.disabled = true;
                return false;
            }
        }

        function startVolumeMeter() {
            if (volAnimId) cancelAnimationFrame(volAnimId);
            function update() {
                if (analyserNode && dataArray) {
                    analyserNode.getByteTimeDomainData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        const v = (dataArray[i] - 128) / 128;
                        sum += v * v;
                    }
                    const rms = Math.sqrt(sum / dataArray.length);
                    const level = Math.min(100, Math.round(rms * 200));
                    micLevelFill.style.width = level + '%';
                    micLevelText.textContent = level + '%';
                }
                volAnimId = requestAnimationFrame(update);
            }
            update();
        }

        function stopVolumeMeter() {
            if (volAnimId) {
                cancelAnimationFrame(volAnimId);
                volAnimId = null;
            }
        }

        // ============================================================
        //  JOIN CHAT
        // ============================================================
        async function joinChat() {
            const name = displayNameInput.value.trim();
            if (!name) {
                showToast('⚠️ Введите ваше имя');
                return;
            }
            displayName = name;
            localStorage.setItem('wtDisplayName', displayName);
            joinBtn.disabled = true;
            joinBtn.textContent = '⏳ Подключение...';
            statusText.textContent = '⏳ Подключение...';

            try {
                const userRef = db.ref(DB_ROOT + '/users/' + userId);
                await userRef.set({
                    name: displayName,
                    connected: true,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                userRef.onDisconnect().remove();

                // Users
                db.ref(DB_ROOT + '/users').on('value', snap => {
                    renderUsers(snap.val());
                });

                // Messages — child_added
                db.ref(DB_ROOT + '/messages').on('child_added', snap => {
                    const data = snap.val();
                    onMessageAdded(data, snap.key);
                });

                // Also listen for child_removed to clean up UI if needed
                db.ref(DB_ROOT + '/messages').on('child_removed', snap => {
                    // optional: we don't show a list, so nothing to remove
                });

                // Get last message for repeat
                const lastSnap = await db.ref(DB_ROOT + '/messages').orderByKey().limitToLast(1).once('value');
                if (lastSnap.exists()) {
                    const entries = Object.entries(lastSnap.val());
                    if (entries.length > 0) {
                        const [key, data] = entries[0];
                        lastMessageData = { id: key, ...data };
                        updateLastMsgInfo();
                        repeatBtn.disabled = false;
                        repeatBadge.textContent = '1';
                    }
                }

                // Microphone
                const ok = await setupMicrophone();
                if (!ok) {
                    joinBtn.disabled = false;
                    joinBtn.textContent = '🔗 Присоединиться';
                    return;
                }

                isJoined = true;
                joinBtn.textContent = '✅ Подключён';
                joinBtn.disabled = true;
                greeting.textContent = `📻 ${displayName}, нажмите «Записать» чтобы говорить`;
                statusText.textContent = '🎤 Готов к записи';
                connectionDot.className = 'dot online';
                connectionLabel.textContent = `В чате как ${displayName}`;
                pttBtn.disabled = false;
                showToast(`✅ ${displayName} присоединился к переговорному`);

            } catch (e) {
                console.error('Join error:', e);
                statusText.textContent = '❌ Ошибка подключения: ' + e.message;
                joinBtn.disabled = false;
                joinBtn.textContent = '🔗 Присоединиться';
                showToast('⚠️ Ошибка подключения к чату');
            }
        }

        // ============================================================
        //  USERS
        // ============================================================
        function renderUsers(users) {
            usersList.innerHTML = '';
            if (!users) {
                userCount.textContent = '0 онлайн';
                return;
            }
            const entries = Object.entries(users);
            const online = entries.filter(([_, u]) => u.connected);
            const offline = entries.filter(([_, u]) => !u.connected);

            const all = [...online, ...offline];
            if (all.length === 0) {
                usersList.innerHTML = '<li style="color:var(--text-dim);font-size:0.8rem;">Нет пользователей</li>';
                userCount.textContent = '0 онлайн';
                return;
            }

            all.forEach(([id, u]) => {
                const li = document.createElement('li');
                const isSelf = id === userId;
                const isOnline = u.connected;
                li.innerHTML = `
                    <span class="online-dot" style="background:${isOnline ? 'var(--success)' : '#555'};"></span>
                    <span class="${isSelf ? 'self' : ''}">${escapeHtml(u.name || 'Unknown')}</span>
                    ${isSelf ? ' (вы)' : ''}
                    ${!isOnline ? ' 🔌' : ''}
                `;
                if (!isOnline) li.classList.add('offline-user');
                usersList.appendChild(li);
            });

            const onlineCount = online.length;
            userCount.textContent = onlineCount + ' онлайн';
        }

        // ============================================================
        //  MESSAGE HANDLING
        // ============================================================
        function onMessageAdded(data, key) {
            // Ignore if sent by self
            if (data.userId === userId) {
                // still update last message for repeat
                lastMessageData = { id: key, ...data };
                updateLastMsgInfo();
                repeatBtn.disabled = false;
                repeatBadge.textContent = '1';
                sentCount++;
                statSent.textContent = 'Отправлено: ' + sentCount;
                return;
            }

            // Received from another user
            receivedCount++;
            statReceived.textContent = 'Получено: ' + receivedCount;
            lastMessageData = { id: key, ...data };
            updateLastMsgInfo();
            repeatBtn.disabled = false;
            repeatBadge.textContent = '1';

            // Auto-play
            playAudioFromData(data, true);
            showToast(`🔊 ${data.author || 'Кто-то'} передал сообщение`);
        }

        function updateLastMsgInfo() {
            if (lastMessageData) {
                const author = lastMessageData.author || 'Unknown';
                const time = lastMessageData.timestamp ? new Date(lastMessageData.timestamp).toLocaleTimeString() : '';
                lastMsgInfo.innerHTML = `
                    <strong style="color:var(--accent);">${escapeHtml(author)}</strong>
                    <span style="color:var(--text-dim);font-size:0.75rem;">${time}</span>
                    <br><span style="font-size:0.75rem;color:var(--text-dim);">${lastMessageData.duration ? '⏱ ' + lastMessageData.duration + 'с' : '🎵 аудио'}</span>
                `;
            } else {
                lastMsgInfo.textContent = 'Нет сообщений';
            }
        }

        // ============================================================
        //  PLAY AUDIO
        // ============================================================
        function playAudioFromData(data, autoPlay = true) {
            try {
                const mime = data.mimeType || 'audio/webm';
                const base64 = data.audioBase64;
                if (!base64) return;

                // Stop any currently playing audio
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.src = '';
                    currentAudio = null;
                }

                const audio = new Audio();
                audio.src = `data:${mime};base64,${base64}`;
                audio.volume = playbackVolume;
                audio.preload = 'auto';

                audio.addEventListener('ended', () => {
                    isPlaying = false;
                    statusText.textContent = '🔇 Воспроизведение завершено';
                });

                audio.addEventListener('play', () => {
                    isPlaying = true;
                    statusText.textContent = `🔊 Воспроизведение от ${data.author || 'пользователя'}`;
                });

                audio.addEventListener('error', (e) => {
                    console.warn('Audio error:', e);
                    isPlaying = false;
                    statusText.textContent = '⚠️ Ошибка воспроизведения';
                });

                currentAudio = audio;

                if (autoPlay) {
                    const playPromise = audio.play();
                    if (playPromise) {
                        playPromise.catch(err => {
                            console.warn('Auto-play blocked:', err);
                            statusText.textContent = '👆 Нажмите «Повторить» для воспроизведения';
                            // Still keep the audio loaded
                        });
                    }
                }
            } catch (e) {
                console.error('Play error:', e);
            }
        }

        // ============================================================
        //  PTT BUTTON (Record / Send)
        // ============================================================
        function handlePttClick() {
            if (!isJoined) {
                showToast('⚠️ Сначала присоединитесь к чату');
                return;
            }
            if (!localStream) {
                showToast('⚠️ Микрофон недоступен');
                return;
            }

            if (isRecording) {
                // Currently recording → Send
                stopRecordingAndSend();
            } else {
                // Start recording
                startRecording();
            }
        }

        function startRecording() {
            if (isRecording) return;
            if (!localStream) {
                showToast('⚠️ Микрофон не готов');
                return;
            }

            audioChunks = [];
            const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
            mediaRecorder = new MediaRecorder(localStream, { mimeType });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                isRecording = false;
                pttBtn.classList.remove('recording');
                pttBtn.querySelector('.icon').textContent = '📤';
                pttBtn.querySelector('.label').textContent = 'Отправить';
                pttBtn.querySelector('.sub').textContent = 'нажмите чтобы отправить';
                recordTimer.textContent = '';
                clearInterval(recordTimerId);
                recordTimerId = null;
                statusText.textContent = '⏹ Запись остановлена. Нажмите «Отправить»';
            };

            mediaRecorder.start();
            isRecording = true;
            recordStartTime = Date.now();

            pttBtn.classList.add('recording');
            pttBtn.querySelector('.icon').textContent = '🔴';
            pttBtn.querySelector('.label').textContent = 'Запись...';
            pttBtn.querySelector('.sub').textContent = 'нажмите для отправки';
            statusText.textContent = '⏺ Идёт запись...';

            // Timer
            let elapsed = 0;
            recordTimerId = setInterval(() => {
                elapsed = Math.round((Date.now() - recordStartTime) / 1000);
                recordTimer.textContent = formatTime(elapsed);
                if (elapsed >= 60) {
                    // Auto-stop at 60 seconds
                    stopRecordingAndSend();
                }
            }, 200);

            // Auto-stop after 60s
            setTimeout(() => {
                if (isRecording) {
                    stopRecordingAndSend();
                }
            }, 60000);

            showToast('🔴 Запись началась...');
        }

        function stopRecordingAndSend() {
            if (!isRecording) {
                return;
            }
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                const onStopHandler = () => {
                    mediaRecorder.removeEventListener('stop', onStopHandler);
                    if (audioChunks.length === 0) {
                        showToast('⚠️ Запись пуста, попробуйте снова');
                        resetPttButton();
                        return;
                    }
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                    if (blob.size < 500) {
                        showToast('⚠️ Запись слишком короткая');
                        resetPttButton();
                        return;
                    }
                    sendAudioBlob(blob, mediaRecorder.mimeType);
                };
                mediaRecorder.addEventListener('stop', onStopHandler);
            } else {
                resetPttButton();
            }
        }

        function resetPttButton() {
            isRecording = false;
            pttBtn.classList.remove('recording');
            pttBtn.querySelector('.icon').textContent = '🎤';
            pttBtn.querySelector('.label').textContent = 'Записать';
            pttBtn.querySelector('.sub').textContent = 'нажмите для записи';
            recordTimer.textContent = '';
            if (recordTimerId) {
                clearInterval(recordTimerId);
                recordTimerId = null;
            }
            statusText.textContent = '🎤 Готов к записи';
        }

        // ============================================================
        //  SEND AUDIO
        // ============================================================
        function sendAudioBlob(blob, mimeType) {
            const reader = new FileReader();
            reader.onload = function() {
                const base64 = reader.result.split(',')[1] || reader.result;
                const duration = Math.round((Date.now() - recordStartTime) / 1000);

                const data = {
                    author: displayName,
                    userId: userId,
                    audioBase64: base64,
                    mimeType: mimeType || 'audio/webm',
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    duration: duration
                };

                db.ref(DB_ROOT + '/messages').push(data)
                    .then(() => {
                        showToast('✅ Сообщение отправлено');
                        resetPttButton();
                        sentCount++;
                        statSent.textContent = 'Отправлено: ' + sentCount;
                    })
                    .catch(err => {
                        console.error('Send error:', err);
                        showToast('❌ Ошибка отправки');
                        resetPttButton();
                    });
            };
            reader.onerror = () => {
                showToast('❌ Ошибка чтения аудио');
                resetPttButton();
            };
            reader.readAsDataURL(blob);
        }

        // Override onMessageAdded to handle self messages for repeat
        const _origOnMessageAdded = onMessageAdded;
        onMessageAdded = function(data, key) {
            if (data.userId === userId) {
                lastMessageData = { id: key, ...data };
                updateLastMsgInfo();
                repeatBtn.disabled = false;
                repeatBadge.textContent = '1';
                sentCount++;
                statSent.textContent = 'Отправлено: ' + sentCount;
                return;
            }
            _origOnMessageAdded(data, key);
        };

        // ============================================================
        //  REPEAT
        // ============================================================
        function handleRepeat() {
            if (!lastMessageData) {
                showToast('⚠️ Нет сохранённых сообщений');
                return;
            }
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            playAudioFromData(lastMessageData, true);
            showToast(`🔁 Повтор от ${lastMessageData.author || 'пользователя'}`);
        }

        // ============================================================
        //  CLEAR ALL
        // ============================================================
        function clearAllMessages() {
            if (!db) return;
            if (!confirm('Удалить все голосовые сообщения из базы?\nЭто действие необратимо.')) return;
            db.ref(DB_ROOT + '/messages').remove()
                .then(() => {
                    showToast('🗑️ Все сообщения удалены');
                    lastMessageData = null;
                    updateLastMsgInfo();
                    repeatBtn.disabled = true;
                    repeatBadge.textContent = '0';
                    sentCount = 0;
                    receivedCount = 0;
                    statSent.textContent = 'Отправлено: 0';
                    statReceived.textContent = 'Получено: 0';
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio = null;
                    }
                    statusText.textContent = '🗑️ История очищена';
                })
                .catch(err => {
                    console.error('Clear error:', err);
                    showToast('❌ Ошибка очистки');
                });
        }

                        let mediaRecorder = null;
                        let audioChunks = [];
                        let isRecording = false;
                        let recordStartTime = 0;
                        let recordTimerId = null;
                        let isJoined = false;

                        // Для повтора
                        let lastMessageData = null;
                        let currentAudio = null;
                        let isPlaying = false;

                        const pttBtn = document.getElementById('pip-ptt');
                        const statusEl = document.getElementById('pip-status');
                        const timerEl = document.getElementById('pip-timer');
                        const levelFill = document.getElementById('pip-level-fill');
                        const levelText = document.getElementById('pip-level-text');
                        const lastMsgEl = document.getElementById('pip-last-msg');
                        const repeatBtn = document.getElementById('pip-repeat-btn');

                        // Подключение к чату
                        async function joinPip() {
                            try {
                                const userRef = db.ref(DB_ROOT + '/users/' + userId);
                                await userRef.set({
                                    name: displayName,
                                    connected: true,
                                    timestamp: firebase.database.ServerValue.TIMESTAMP
                                });
                                userRef.onDisconnect().remove();

                                // Подписываемся на сообщения
                                db.ref(DB_ROOT + '/messages').on('child_added', snap => {
                                    const data = snap.val();
                                    // Обновляем последнее сообщение для повтора (все сообщения, включая свои)
                                    lastMessageData = { id: snap.key, ...data };
                                    updateLastMsgInfo();
                                    repeatBtn.disabled = false;
                                });

                                // Для очистки при удалении (опционально)
                                db.ref(DB_ROOT + '/messages').on('child_removed', snap => {
                                    // Если удалено текущее последнее, можно перезапросить
                                    // Для простоты просто пометим, что нет данных
                                    lastMessageData = null;
                                    updateLastMsgInfo();
                                    repeatBtn.disabled = true;
                                });

                                // Настройка микрофона
                                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                                localStream = stream;

                                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                                analyserNode = audioContext.createAnalyser();
                                analyserNode.fftSize = 256;
                                micSource = audioContext.createMediaStreamSource(stream);
                                micSource.connect(analyserNode);
                                dataArray = new Uint8Array(analyserNode.frequencyBinCount);

                                startVolumeMeter();
                                pttBtn.disabled = false;
                                statusEl.textContent = '🎙️ Готов к записи';
                                isJoined = true;

                                // Обработчик кнопки записи
                                pttBtn.addEventListener('click', handlePttClick);
                                // Обработчик кнопки повтора
                                repeatBtn.addEventListener('click', handleRepeat);

                                // При закрытии окна — отключаемся
                                window.addEventListener('beforeunload', () => {
                                    if (db) db.ref(DB_ROOT + '/users/' + userId).remove();
                                    if (localStream) localStream.getTracks().forEach(t => t.stop());
                                    if (audioContext) audioContext.close();
                                    if (volAnimId) cancelAnimationFrame(volAnimId);
                                    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
                                });

                            } catch (e) {
                                console.error('PiP join error:', e);
                                statusEl.textContent = '❌ Ошибка: ' + e.message;
                            }
                        }

                        function startVolumeMeter() {
                            function update() {
                                if (analyserNode && dataArray) {
                                    analyserNode.getByteTimeDomainData(dataArray);
                                    let sum = 0;
                                    for (let i = 0; i < dataArray.length; i++) {
                                        const v = (dataArray[i] - 128) / 128;
                                        sum += v * v;
                                    }
                                    const rms = Math.sqrt(sum / dataArray.length);
                                    const level = Math.min(100, Math.round(rms * 200));
                                    levelFill.style.width = level + '%';
                                    levelText.textContent = level + '%';
                                }
                                volAnimId = requestAnimationFrame(update);
                            }
                            update();
                        }

                        function handlePttClick() {
                            if (!isJoined) return;
                            if (!localStream) return;

                            if (isRecording) {
                                stopRecordingAndSend();
                            } else {
                                startRecording();
                            }
                        }

                        function startRecording() {
                            if (isRecording) return;
                            audioChunks = [];
                            const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
                            mediaRecorder = new MediaRecorder(localStream, { mimeType });
                            mediaRecorder.ondataavailable = (e) => {
                                if (e.data.size > 0) audioChunks.push(e.data);
                            };
                            mediaRecorder.onstop = () => {
                                isRecording = false;
                                pttBtn.classList.remove('recording');
                                pttBtn.querySelector('.icon').textContent = '📤';
                                pttBtn.querySelector('.label').textContent = 'Отправить';
                                pttBtn.querySelector('.sub').textContent = 'нажмите чтобы отправить';
                                timerEl.textContent = '';
                                clearInterval(recordTimerId);
                                recordTimerId = null;
                                statusEl.textContent = '⏹ Запись остановлена. Нажмите «Отправить»';
                            };
                            mediaRecorder.start();
                            isRecording = true;
                            recordStartTime = Date.now();

                            pttBtn.classList.add('recording');
                            pttBtn.querySelector('.icon').textContent = '🔴';
                            pttBtn.querySelector('.label').textContent = 'Запись...';
                            pttBtn.querySelector('.sub').textContent = 'нажмите для отправки';
                            statusEl.textContent = '⏺ Идёт запись...';

                            let elapsed = 0;
                            recordTimerId = setInterval(() => {
                                elapsed = Math.round((Date.now() - recordStartTime) / 1000);
                                timerEl.textContent = formatTime(elapsed);
                                if (elapsed >= 60) stopRecordingAndSend();
                            }, 200);

                            setTimeout(() => { if (isRecording) stopRecordingAndSend(); }, 60000);
                        }

                        function stopRecordingAndSend() {
                            if (!isRecording) return;
                            if (mediaRecorder && mediaRecorder.state === 'recording') {
                                mediaRecorder.stop();
                                const onStop = () => {
                                    mediaRecorder.removeEventListener('stop', onStop);
                                    if (audioChunks.length === 0) {
                                        statusEl.textContent = '⚠️ Запись пуста';
                                        resetPtt();
                                        return;
                                    }
                                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                                    if (blob.size < 500) {
                                        statusEl.textContent = '⚠️ Слишком коротко';
                                        resetPtt();
                                        return;
                                    }
                                    sendAudio(blob, mediaRecorder.mimeType);
                                };
                                mediaRecorder.addEventListener('stop', onStop);
                            } else {
                                resetPtt();
                            }
                        }

                        function sendAudio(blob, mimeType) {
                            const reader = new FileReader();
                            reader.onload = function() {
                                const base64 = reader.result.split(',')[1] || reader.result;
                                const duration = Math.round((Date.now() - recordStartTime) / 1000);
                                const data = {
                                    author: displayName,
                                    userId: userId,
                                    audioBase64: base64,
                                    mimeType: mimeType || 'audio/webm',
                                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                                    duration: duration
                                };
                                db.ref(DB_ROOT + '/messages').push(data)
                                    .then(() => {
                                        statusEl.textContent = '✅ Отправлено';
                                        resetPtt();
                                    })
                                    .catch(err => {
                                        console.error('Send error:', err);
                                        statusEl.textContent = '❌ Ошибка отправки';
                                        resetPtt();
                                    });
                            };
                            reader.onerror = () => {
                                statusEl.textContent = '❌ Ошибка чтения';
                                resetPtt();
                            };
                            reader.readAsDataURL(blob);
                        }

                        function resetPtt() {
                            isRecording = false;
                            pttBtn.classList.remove('recording');
                            pttBtn.querySelector('.icon').textContent = '🎤';
                            pttBtn.querySelector('.label').textContent = 'Записать';
                            pttBtn.querySelector('.sub').textContent = 'нажмите для записи';
                            timerEl.textContent = '';
                            if (recordTimerId) { clearInterval(recordTimerId); recordTimerId = null; }
                            statusEl.textContent = '🎤 Готов к записи';
                        }

                        function formatTime(sec) {
                            const m = Math.floor(sec / 60);
                            const s = Math.floor(sec % 60);
                            return m + ':' + String(s).padStart(2, '0');
                        }

                        // --- Функции для повтора ---
                        function updateLastMsgInfo() {
                            if (lastMessageData) {
                                const author = lastMessageData.author || 'Unknown';
                                const time = lastMessageData.timestamp ? new Date(lastMessageData.timestamp).toLocaleTimeString() : '';
                                lastMsgEl.innerHTML = \`
                                    <strong>\${escapeHtml(author)}</strong>
                                    <span style="color:#8892a3;font-size:0.6rem;">\${time}</span>
                                    <span style="color:#8892a3;font-size:0.6rem;">\${lastMessageData.duration ? '⏱ ' + lastMessageData.duration + 'с' : ''}</span>
                                \`;
                                repeatBtn.disabled = false;
                            } else {
                                lastMsgEl.textContent = 'Нет сообщений';
                                repeatBtn.disabled = true;
                            }
                        }

                        function playAudioFromData(data, autoPlay = true) {
                            try {
                                const mime = data.mimeType || 'audio/webm';
                                const base64 = data.audioBase64;
                                if (!base64) return;
                                if (currentAudio) {
                                    currentAudio.pause();
                                    currentAudio.src = '';
                                    currentAudio = null;
                                }
                                const audio = new Audio();
                                audio.src = \`data:\${mime};base64,\${base64}\`;
                                audio.volume = 0.8; // можно добавить регулятор, но для простоты фиксируем
                                audio.preload = 'auto';
                                audio.addEventListener('ended', () => {
                                    isPlaying = false;
                                    statusEl.textContent = '🔇 Воспроизведение завершено';
                                });
                                audio.addEventListener('play', () => {
                                    isPlaying = true;
                                    statusEl.textContent = '🔊 Воспроизведение';
                                });
                                audio.addEventListener('error', (e) => {
                                    console.warn('Audio error:', e);
                                    isPlaying = false;
                                    statusEl.textContent = '⚠️ Ошибка воспроизведения';
                                });
                                currentAudio = audio;
                                if (autoPlay) {
                                    const playPromise = audio.play();
                                    if (playPromise) {
                                        playPromise.catch(err => {
                                            console.warn('Auto-play blocked:', err);
                                            statusEl.textContent = '👆 Нажмите «Повторить» для воспроизведения';
                                        });
                                    }
                                }
                            } catch (e) {
                                console.error('Play error:', e);
                            }
                        }

                        function handleRepeat() {
                            if (!lastMessageData) {
                                statusEl.textContent = '⚠️ Нет сообщений';
                                return;
                            }
                            if (currentAudio) {
                                currentAudio.pause();
                                currentAudio = null;
                            }
                            playAudioFromData(lastMessageData, true);
                            statusEl.textContent = '🔁 Повтор...';
                        }

                        function escapeHtml(text) {
                            const d = document.createElement('div');
                            d.textContent = text;
                            return d.innerHTML;
                        }

                        // Запуск
                        joinPip();
                    <\/script>
                </body>
                </html>
                `;

                pipWindow.document.write(htmlContent);
                pipWindow.document.close();

                pipWindow.addEventListener('pagehide', () => {
                    // ничего не делаем, уже есть очистка в beforeunload
                });

            } catch (err) {
                console.error('PiP error:', err);
                showToast('❌ Не удалось открыть мини-плеер: ' + err.message);
            }
        }

        // ============================================================
        //  UTILITY
        // ============================================================
        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m + ':' + String(s).padStart(2, '0');
        }

        // ============================================================
        //  START
        // ============================================================
        initFirebase();

        // Handle page unload
        window.addEventListener('beforeunload', () => {
            if (db && userId) {
                db.ref(DB_ROOT + '/users/' + userId).remove();
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
            }
            stopVolumeMeter();
            if (audioContext) audioContext.close();
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
        });

        console.log('📻 Переговорное устройство загружено');
        console.log('🔑 userId:', userId);
        console.log('📁 Firebase path:', DB_ROOT);
    </script>
</body>
</html>
