<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переговорное устройство «Директор-Секретарь»</title>

    <!-- Firebase compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js">
    </script>

    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --surface2: #1f2b4d;
            --accent: #e94560;
            --accent-hover: #ff6b81;
            --green: #2ecc71;
            --green-hover: #27ae60;
            --blue: #3498db;
            --blue-hover: #2980b9;
            --text: #e0e0e0;
            --text-muted: #9a9ab0;
            --border: #2a3a5e;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--blue), var(--green));
        }

        h1 {
            text-align: center;
            font-size: 1.6em;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9em;
            margin-bottom: 25px;
        }

        /* --- Login Screen --- */
        #loginScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding: 20px 0;
        }

        #loginScreen .icon {
            font-size: 4em;
            margin-bottom: 10px;
        }

        #loginScreen h2 {
            font-weight: 500;
            font-size: 1.2em;
            color: var(--text-muted);
        }

        .nickname-input-wrap {
            width: 100%;
            max-width: 320px;
            position: relative;
        }

        .nickname-input-wrap input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }

        .nickname-input-wrap input:focus {
            border-color: var(--blue);
        }

        .nickname-input-wrap input::placeholder {
            color: var(--text-muted);
        }

        /* --- Main Interface --- */
        #mainInterface {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .user-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface2);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 0.9em;
            flex-wrap: wrap;
            gap: 8px;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .user-badge .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9em;
            color: #fff;
            text-transform: uppercase;
        }

        .user-badge .nickname-display {
            color: var(--text);
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8em;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.5);
            }
            50% {
                box-shadow: 0 0 0 6px rgba(46, 204, 113, 0);
            }
        }

        .device-select-wrap {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .device-select-wrap label {
            font-size: 0.85em;
            color: var(--text-muted);
            font-weight: 500;
        }

        .device-select-wrap select {
            padding: 12px 14px;
            border-radius: 10px;
            border: 2px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 0.95em;
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s;
            width: 100%;
        }

        .device-select-wrap select:focus {
            border-color: var(--blue);
        }

        .device-select-wrap select option {
            background: var(--surface);
            color: var(--text);
        }

        .buttons-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn {
            padding: 16px 32px;
            border-radius: 50px;
            border: none;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            min-width: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-record {
            background: var(--green);
            color: #fff;
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.35);
        }

        .btn-record:hover:not(:disabled) {
            background: var(--green-hover);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.45);
        }

        .btn-record.recording {
            background: var(--accent);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.35);
            animation: recordingPulse 1.5s infinite;
        }

        .btn-record.recording:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        @keyframes recordingPulse {
            0%,
            100% {
                box-shadow: 0 6px 20px rgba(233, 69, 96, 0.35);
            }
            50% {
                box-shadow: 0 6px 30px rgba(233, 69, 96, 0.6);
            }
        }

        .btn-repeat {
            background: var(--blue);
            color: #fff;
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.35);
        }

        .btn-repeat:hover:not(:disabled) {
            background: var(--blue-hover);
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.45);
        }

        .recording-indicator {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9em;
            color: var(--accent);
            font-weight: 500;
        }

        .recording-indicator.active {
            display: flex;
        }

        .recording-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .recording-timer {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .status-message {
            text-align: center;
            font-size: 0.85em;
            color: var(--text-muted);
            min-height: 20px;
            transition: color 0.3s;
        }

        .status-message.success {
            color: var(--green);
        }
        .status-message.error {
            color: var(--accent);
        }
        .status-message.info {
            color: var(--blue);
        }

        .audio-hidden {
            display: none;
        }

        .login-btn {
            background: var(--blue);
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            border: none;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.3);
            letter-spacing: 0.5px;
        }

        .login-btn:hover {
            background: var(--blue-hover);
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.4);
        }
        .login-btn:active {
            transform: scale(0.96);
        }

        .btn .icon {
            font-size: 1.2em;
        }

        @media (max-width: 480px) {
            .container {
                padding: 18px;
                border-radius: 16px;
            }
            h1 {
                font-size: 1.3em;
            }
            .btn {
                padding: 14px 20px;
                font-size: 0.95em;
                min-width: 120px;
            }
            .buttons-row {
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎙️ Переговорное устройство</h1>
        <p class="subtitle">«Директор — Секретарь»</p>

        <!-- ЭКРАН ВХОДА -->
        <div id="loginScreen">
            <div class="icon">🎧</div>
            <h2>Введите ваш ник</h2>
            <div class="nickname-input-wrap">
                <input
                type="text"
                id="nicknameInput"
                placeholder="Например: Директор"
                maxlength="20"
                autocomplete="off"
                />
            </div>
            <button class="login-btn" id="loginBtn">Войти</button>
        </div>

        <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
        <div id="mainInterface">
            <div class="user-bar">
                <div class="user-badge">
                    <div class="avatar" id="avatarLetter">Д</div>
                    <span class="nickname-display" id="nicknameDisplay">Директор</span>
                </div>
                <div class="connection-status">
                    <div class="status-dot"></div>
                    <span>Подключено</span>
                </div>
            </div>

            <div class="device-select-wrap">
                <label for="micSelect">🎤 Устройство записи:</label>
                <select id="micSelect">
                    <option value="default">Микрофон по умолчанию</option>
                </select>
            </div>

            <div class="buttons-row">
                <button class="btn btn-record" id="recordBtn">
                    <span class="icon">🎙️</span>
                    <span id="recordBtnText">Записать</span>
                </button>
                <button class="btn btn-repeat" id="repeatBtn">
                    <span class="icon">🔁</span>
                    Повторить
                </button>
            </div>

            <div class="recording-indicator" id="recordingIndicator">
                <div class="recording-dot"></div>
                <span>Идёт запись…</span>
                <span class="recording-timer" id="recordingTimer">0:00</span>
            </div>

            <div class="status-message" id="statusMessage"></div>
        </div>
    </div>

    <!-- Скрытый аудио-элемент для воспроизведения -->
    <audio id="audioPlayer" class="audio-hidden"></audio>

    <script>
        (function() {
            // ==== КОНФИГУРАЦИЯ FIREBASE ====
            const firebaseConfig = {
                apiKey: "AIzaSyB9Kn7XlW7Gofyz-5JfKo8V2n53DpKdMnM",
                authDomain: "hectortw-apoj.firebaseapp.com",
                databaseURL: "https://hectortw-apoj-default-rtdb.europe-west1.firebasedatabase.app",
                projectId: "hectortw-apoj",
                storageBucket: "hectortw-apoj.firebasestorage.app",
                messagingSenderId: "167890858554",
                appId: "1:167890858554:web:abdbad2243e223f5457b03"
            };

            // ==== ИНИЦИАЛИЗАЦИЯ FIREBASE ====
            firebase.initializeApp(firebaseConfig);
            const database = firebase.database();

            // ==== ПУТЬ В БАЗЕ ДАННЫХ ====
            const DB_ROOT = 'intercom';
            const DB_MESSAGES = `${DB_ROOT}/messages`;

            // ==== СОСТОЯНИЕ ====
            let myNickname = '';
            let connectionTime = Date.now();
            let isRecording = false;
            let mediaRecorder = null;
            let audioChunks = [];
            let currentStream = null;
            let recordingStartTime = 0;
            let recordingTimerInterval = null;
            let lastAudioSrc = null; // data URL последнего аудио для "Повторить"
            let lastAudioTimestamp = 0;
            let isPlaying = false;
            let selectedDeviceId = 'default';
            let audioDevices = [];

            // ==== ЭЛЕМЕНТЫ DOM ====
            const loginScreen = document.getElementById('loginScreen');
            const mainInterface = document.getElementById('mainInterface');
            const nicknameInput = document.getElementById('nicknameInput');
            const loginBtn = document.getElementById('loginBtn');
            const nicknameDisplay = document.getElementById('nicknameDisplay');
            const avatarLetter = document.getElementById('avatarLetter');
            const micSelect = document.getElementById('micSelect');
            const recordBtn = document.getElementById('recordBtn');
            const recordBtnText = document.getElementById('recordBtnText');
            const repeatBtn = document.getElementById('repeatBtn');
            const recordingIndicator = document.getElementById('recordingIndicator');
            const recordingTimer = document.getElementById('recordingTimer');
            const statusMessage = document.getElementById('statusMessage');
            const audioPlayer = document.getElementById('audioPlayer');

            // ==== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====

            function showStatus(message, type = 'info') {
                statusMessage.textContent = message;
                statusMessage.className = 'status-message';
                if (type === 'success') statusMessage.classList.add('success');
                if (type === 'error') statusMessage.classList.add('error');
                if (type === 'info') statusMessage.classList.add('info');
                // Автоскрытие через 4 секунды
                clearTimeout(statusMessage._timeout);
                statusMessage._timeout = setTimeout(() => {
                    statusMessage.textContent = '';
                    statusMessage.className = 'status-message';
                }, 4000);
            }

            function formatTime(seconds) {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            function getSupportedMimeType() {
                const types = [
                    'audio/webm;codecs=opus',
                    'audio/webm',
                    'audio/mp4',
                    'audio/ogg;codecs=opus',
                    'audio/wav',
                    ''
                ];
                for (const type of types) {
                    if (type === '') return '';
                    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) {
                        return type;
                    }
                }
                return '';
            }

            function blobToDataURL(blob) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => reject(new Error('Не удалось прочитать аудио-данные'));
                    reader.readAsDataURL(blob);
                });
            }

            // ==== ПЕРЕЧИСЛЕНИЕ МИКРОФОНОВ ====
            async function enumerateMicrophones() {
                try {
                    // Сначала запросим разрешение (нужно для получения названий устройств)
                    await navigator.mediaDevices.getUserMedia({ audio: true })
                        .then(stream => {
                            // Останавливаем сразу — просто для получения разрешения
                            stream.getTracks().forEach(track => track.stop());
                        })
                        .catch(() => {
                            // Пользователь отказал, но мы всё равно попробуем перечислить устройства
                        });

                    const devices = await navigator.mediaDevices.enumerateDevices();
                    audioDevices = devices.filter(d => d.kind === 'audioinput');

                    // Заполняем селект
                    micSelect.innerHTML = '';
                    if (audioDevices.length === 0) {
                        const opt = document.createElement('option');
                        opt.value = 'default';
                        opt.textContent = 'Микрофон по умолчанию';
                        micSelect.appendChild(opt);
                        return;
                    }

                    audioDevices.forEach((device, index) => {
                        const opt = document.createElement('option');
                        opt.value = device.deviceId;
                        opt.textContent = device.label || `Микрофон ${index + 1}`;
                        micSelect.appendChild(opt);
                    });

                    // Выбираем первый ненулевой deviceId, иначе default
                    const firstRealDevice = audioDevices.find(d => d.deviceId && d.deviceId !== 'default');
                    if (firstRealDevice) {
                        selectedDeviceId = firstRealDevice.deviceId;
                        micSelect.value = selectedDeviceId;
                    } else if (audioDevices.length > 0) {
                        selectedDeviceId = audioDevices[0].deviceId;
                        micSelect.value = selectedDeviceId;
                    } else {
                        selectedDeviceId = 'default';
                    }
                } catch (error) {
                    console.warn('Не удалось перечислить микрофоны:', error);
                    // Оставляем только "default"
                    micSelect.innerHTML = '<option value="default">Микрофон по умолчанию</option>';
                }
            }

            // Обработчик изменения микрофона
            micSelect.addEventListener('change', () => {
                selectedDeviceId = micSelect.value;
                // Если идёт запись — остановим и сбросим
                if (isRecording) {
                    stopRecording(true);
                }
                showStatus('Микрофон выбран: ' + (micSelect.options[micSelect.selectedIndex]?.textContent || 'Неизвестно'),
                    'info');
            });

            // ==== ПОЛУЧЕНИЕ ПОТОКА ЗАПИСИ ====
            async function getRecordingStream() {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                }

                const constraints = {
                    audio: selectedDeviceId && selectedDeviceId !== 'default' ?
                        { deviceId: { exact: selectedDeviceId } } :
                        true
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                currentStream = stream;
                return stream;
            }

            // ==== НАЧАЛО ЗАПИСИ ====
            async function startRecording() {
                if (isRecording) return;

                try {
                    const stream = await getRecordingStream();
                    const mimeType = getSupportedMimeType();
                    const options = mimeType ? { mimeType } : {};
                    mediaRecorder = new MediaRecorder(stream, options);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data && event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(audioChunks, {
                            type: mediaRecorder.mimeType || 'audio/webm'
                        });
                        audioChunks = [];

                        if (blob.size === 0) {
                            showStatus('Запись пуста — попробуйте ещё раз', 'error');
                            resetRecordButton();
                            return;
                        }

                        try {
                            const dataUrl = await blobToDataURL(blob);
                            await sendMessageToFirebase(dataUrl);
                            showStatus('✅ Сообщение отправлено!', 'success');
                        } catch (error) {
                            console.error('Ошибка отправки:', error);
                            showStatus('❌ Ошибка отправки: ' + error.message, 'error');
                        }

                        resetRecordButton();
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordingStartTime = Date.now();

                    // Обновляем UI
                    recordBtn.classList.add('recording');
                    recordBtnText.textContent = 'Отправить';
                    recordingIndicator.classList.add('active');
                    recordingTimer.textContent = '0:00';

                    // Таймер
                    recordingTimerInterval = setInterval(() => {
                        const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
                        recordingTimer.textContent = formatTime(elapsed);

                        // Автостоп при превышении 60 секунд
                        if (elapsed >= 60) {
                            stopRecording(false);
                            showStatus('Максимальная длительность 60 секунд', 'info');
                        }
                    }, 500);

                    showStatus('🔴 Идёт запись...', 'info');
                } catch (error) {
                    console.error('Ошибка при начале записи:', error);
                    showStatus('❌ Нет доступа к микрофону: ' + error.message, 'error');
                    resetRecordButton();
                }
            }

            // ==== ОСТАНОВКА ЗАПИСИ ====
            function stopRecording(silent = false) {
                if (!isRecording) return;

                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
                isRecording = false;

                if (recordingTimerInterval) {
                    clearInterval(recordingTimerInterval);
                    recordingTimerInterval = null;
                }

                recordingIndicator.classList.remove('active');

                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                }

                if (!silent) {
                    showStatus('⏹ Запись остановлена', 'info');
                }
            }

            function resetRecordButton() {
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordBtnText.textContent = 'Записать';
                recordingIndicator.classList.remove('active');

                if (recordingTimerInterval) {
                    clearInterval(recordingTimerInterval);
                    recordingTimerInterval = null;
                }

                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                }
                mediaRecorder = null;
            }

            // ==== ОТПРАВКА В FIREBASE ====
            async function sendMessageToFirebase(dataUrl) {
                const messageData = {
                    sender: myNickname,
                    timestamp: Date.now(),
                    audio: dataUrl
                };

                // Сохраняем в базу
                const newMessageRef = database.ref(DB_MESSAGES).push();
                await newMessageRef.set(messageData);

                // Обновляем последнее аудио для повтора (своё сообщение)
                lastAudioSrc = dataUrl;
                lastAudioTimestamp = Date.now();

                // Очистка старых сообщений (оставляем последние 5)
                cleanupOldMessages();
            }

            async function cleanupOldMessages() {
                try {
                    const snapshot = await database.ref(DB_MESSAGES).orderByChild('timestamp').limitToLast(50).once(
                        'value');
                    const messages = [];
                    snapshot.forEach(child => {
                        messages.push({ key: child.key, ...child.val() });
                    });

                    if (messages.length <= 5) return;

                    // Сортируем по timestamp (старые первыми)
                    messages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                    const toDelete = messages.slice(0, messages.length - 5);

                    for (const msg of toDelete) {
                        await database.ref(`${DB_MESSAGES}/${msg.key}`).remove();
                    }
                } catch (error) {
                    console.warn('Не удалось очистить старые сообщения:', error);
                }
            }

            // ==== ВОСПРОИЗВЕДЕНИЕ АУДИО ====
            function playAudio(dataUrl) {
                return new Promise((resolve, reject) => {
                    if (!dataUrl) {
                        reject(new Error('Нет аудио для воспроизведения'));
                        return;
                    }

                    // Если что-то уже играет — остановим
                    if (!audioPlayer.paused) {
                        audioPlayer.pause();
                        audioPlayer.currentTime = 0;
                    }

                    audioPlayer.src = dataUrl;
                    isPlaying = true;
                    repeatBtn.disabled = true;

                    audioPlayer.onended = () => {
                        isPlaying = false;
                        repeatBtn.disabled = false;
                        resolve();
                    };
                    audioPlayer.onerror = () => {
                        isPlaying = false;
                        repeatBtn.disabled = false;
                        reject(new Error('Ошибка воспроизведения аудио'));
                    };

                    audioPlayer.play().catch(error => {
                        isPlaying = false;
                        repeatBtn.disabled = false;
                        reject(error);
                    });
                });
            }

            // ==== ПОДПИСКА НА СООБЩЕНИЯ FIREBASE ====
            function subscribeToMessages() {
                const messagesRef = database.ref(DB_MESSAGES);

                messagesRef.on('child_added', (snapshot) => {
                    const message = snapshot.val();
                    if (!message || !message.audio) return;

                    const msgTimestamp = message.timestamp || 0;

                    // Пропускаем старые сообщения (до подключения)
                    if (msgTimestamp < connectionTime) return;

                    // Пропускаем свои сообщения (не авто-воспроизводим)
                    if (message.sender === myNickname) return;

                    // Авто-воспроизведение для других пользователей
                    lastAudioSrc = message.audio;
                    lastAudioTimestamp = msgTimestamp;

                    playAudio(message.audio)
                        .then(() => {
                            if (message.sender) {
                                showStatus(`📩 Новое сообщение от "${message.sender}"`, 'info');
                            }
                        })
                        .catch(error => {
                            console.warn('Не удалось автовоспроизвести:', error);
                            showStatus('⚠️ Не удалось воспроизвести входящее сообщение', 'error');
                        });
                });
            }

            // ==== КНОПКА "ПОВТОРИТЬ" ====
            async function handleRepeat() {
                if (isPlaying) return;

                if (!lastAudioSrc) {
                    showStatus('Нет сообщений для повторения', 'info');
                    return;
                }

                try {
                    await playAudio(lastAudioSrc);
                    showStatus('🔁 Повтор последнего сообщения', 'info');
                } catch (error) {
                    console.error('Ошибка повтора:', error);
                    showStatus('❌ Не удалось воспроизвести аудио', 'error');
                }
            }

            // ==== КНОПКА "ЗАПИСАТЬ / ОТПРАВИТЬ" ====
            function handleRecordButton() {
                if (isRecording) {
                    // Отправка
                    stopRecording(false);
                } else {
                    // Начало записи
                    startRecording();
                }
            }

            // ==== ВХОД ====
            function handleLogin() {
                const nickname = nicknameInput.value.trim();
                if (!nickname) {
                    showStatus('Пожалуйста, введите ник', 'error');
                    nicknameInput.focus();
                    return;
                }

                myNickname = nickname;
                connectionTime = Date.now();

                // Обновляем UI
                nicknameDisplay.textContent = nickname;
                avatarLetter.textContent = nickname.charAt(0).toUpperCase();

                // Показываем основной интерфейс
                loginScreen.style.display = 'none';
                mainInterface.style.display = 'flex';

                // Перечисляем микрофоны
                enumerateMicrophones();

                // Подписываемся на сообщения
                subscribeToMessages();

                showStatus(`👋 Добро пожаловать, ${nickname}!`, 'success');
            }

            // ==== ОБРАБОТЧИКИ СОБЫТИЙ ====
            loginBtn.addEventListener('click', handleLogin);
            nicknameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleLogin();
            });
            recordBtn.addEventListener('click', handleRecordButton);
            repeatBtn.addEventListener('click', handleRepeat);

            // Фокус на поле ввода при загрузке
            nicknameInput.focus();

            // ==== ОБРАБОТКА УХОДА СО СТРАНИЦЫ ====
            window.addEventListener('beforeunload', () => {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
            });

            // ==== ПРОВЕРКА ПОДДЕРЖКИ ====
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showStatus('❌ Ваш браузер не поддерживает запись аудио', 'error');
                recordBtn.disabled = true;
            }
            if (typeof MediaRecorder === 'undefined') {
                showStatus('❌ MediaRecorder API не поддерживается', 'error');
                recordBtn.disabled = true;
            }

            console.log('🎙️ Переговорное устройство готово к работе');
            console.log('📡 Firebase подключён, путь:', DB_ROOT);
        })();
    </script>
</body>
</html>
